<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Chat - Register</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1em" height="1em">
                        <rect x="22.5" y="4" width="77.5" height="60.5" rx="8" ry="8" fill="#586ba4"/>
                        <path d="M 0 29.5 A 8 8 0 0 1 8 21.5 H 70 A 8 8 0 0 1 78 29.5 V 74 A 8 8 0 0 1 70 82 H 14 L 0 100 V 29.5 Z" fill="#7086c8"/>
                    </svg>
                </div>
                <h1>Create Account</h1>
                <p>Join Instant Chat today</p>
            </div>

            <!-- Success / error messages -->
            <div id="errorMsg" class="alert alert-error" style="display:none;"></div>
            <div id="successMsg" class="alert alert-success" style="display:none;"></div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                    <span class="field-error" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                    <span class="field-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimum 6 characters" required>
                    <span class="field-error" id="passwordError"></span>
                </div>

                <button type="submit" id="registerBtn" class="btn btn-primary btn-full">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/index.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="/js/register.js"></script>
</body>
</html>
